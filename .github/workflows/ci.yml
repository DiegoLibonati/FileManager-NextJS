name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  # Lint, format, type-check, audit
  # ============================================================
  lint-and-audit:
    name: Lint & Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: ESLint
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

      - name: TypeScript type-check
        run: npm run type-check

      - name: npm audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true

  # ============================================================
  # Tests — bring up the test Mongo via docker compose
  # ============================================================
  test:
    name: Testing
    runs-on: ubuntu-latest
    needs: lint-and-audit

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

  # ============================================================
  # Build — type-check + next build (standalone)
  # ============================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    env:
      # Dummy values so the lazy env loader (zod) and any eager `getEnvs()` call
      # at module load (e.g. `logger.config.ts`) don't fail during `next build`.
      # Real values come from .env at runtime.
      JWT_SECRET: ci-build-only-not-a-real-secret
      MONGO_HOST: localhost
      MONGO_PORT: "27017"
      MONGO_USER: ci
      MONGO_PASS: ci
      MONGO_DB_NAME: ci
      MONGO_AUTH_SOURCE: admin

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

  # ============================================================
  # Docker build — production + development + nginx in parallel
  # ============================================================
  docker-build:
    name: Docker Build - ${{ matrix.tag }}
    runs-on: ubuntu-latest
    needs: build

    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile.development
            tag: nexdrive:dev
          - dockerfile: Dockerfile.production
            tag: nexdrive:prod
          - dockerfile: Dockerfile.nginx
            tag: nexdrive-nginx:latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Build ${{ matrix.dockerfile }}
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.tag }}