version: "3.9"
name: "filemanager-die-prod"

services:
  next-app:
    build:
      context: ./filemanager-app
      dockerfile: Dockerfile.production
    restart: always
    env_file:
      - ./filemanager-app/.env
    ports:
      - "3000:3000"
    networks:
      - filemanager-net

  mongo:
    image: mongo:7
    restart: always
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: pass
    volumes:
      - ./volumes/mongo:/data/db

networks:
  filemanager-net:
